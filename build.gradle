plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'sparbot'
}

loom {
	// src/main runs on both sides (the bots live on the server); src/client holds the optional menu.
	splitEnvironmentSourceSets()
	mods {
		"sparbot" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Adds a "gametest" source set plus runGameTest/runClientGameTest tasks.
	configureTests {
		createSourceSet = true
		modId = "sparbot-gametest"
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The pure-Java brain. Shipped inside the mod jar via jar-in-jar.
	implementation project(':sparbot-core')
	include project(':sparbot-core')

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// The client test's tour of the Deep alone (much quicker): ./gradlew runClientGameTest -PdeepOnly
if (project.hasProperty('deepOnly')) {
	tasks.named('runClientGameTest') {
		jvmArgs "-Dsparbot.deepOnly=true"
	}
}

// Run only some GameTests: ./gradlew runGameTest -PgametestFilter=learned
if (project.hasProperty('gametestFilter')) {
	tasks.named('runGameTest') {
		jvmArgs "-Dfabric-api.gametest.filter=${project.property('gametestFilter')}"
	}
}
