// The SparBot "brain": decision making, skill profiles, input constraints, kits, stats.
// It deliberately has NO Minecraft or Fabric dependency so it stays unit-testable and
// runnable in the duel simulator. NoGameImportsTest additionally scans the bytecode.
plugins {
	id 'java-library'
}

group = rootProject.group
version = rootProject.version

repositories {
	mavenCentral()
}

dependencies {
	// Gson for the JSON profile/kit formats (Minecraft 26.2 ships gson 2.14.0 at runtime; we compile against the same version).
	api 'com.google.code.gson:gson:2.14.0'

	testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

// The scripted tiers against each other in the simulator: ./gradlew :sparbot-core:tournament -Pfights=400
tasks.register('tournament', JavaExec) {
	group = 'sparbot'
	description = 'Prints how often each skill level beats each other one in the duel simulator.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'io.github.flick256.sparbot.core.sim.Tournament'
	args = [project.findProperty('fights') ?: '100']
}

// Full-kit UHC fights between scripted bots in the simulator, with statistics:
// ./gradlew :sparbot-core:uhcLab -Pfights=200 -Pa=pro -Pb=pro -Pkit=sparbot_uhc -Pterrain=false
tasks.register('uhcLab', JavaExec) {
	group = 'sparbot'
	description = 'Runs full-kit UHC fights in the simulator and prints what happened in them.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'io.github.flick256.sparbot.core.sim.UhcLab'
	args = [project.findProperty('fights') ?: '200', project.findProperty('a') ?: 'pro', project.findProperty('b') ?: 'pro',
		project.findProperty('kit') ?: 'sparbot_uhc', project.findProperty('terrain') ?: 'false']
}

// Sword fights between scripted bots in a kit, with how long they last:
// ./gradlew :sparbot-core:swordLab -Pfights=100 -Pa=pro -Pb=intermediate -Pkit=pvphq_sword
tasks.register('swordLab', JavaExec) {
	group = 'sparbot'
	description = 'Runs sword fights in the simulator and prints how long they last and how they were won.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'io.github.flick256.sparbot.core.sim.SwordLab'
	args = [project.findProperty('fights') ?: '100', project.findProperty('a') ?: 'pro', project.findProperty('b') ?: 'pro',
		project.findProperty('kit') ?: 'pvphq_sword']
}
