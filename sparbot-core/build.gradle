// The SparBot "brain": decision making, skill profiles, input constraints, kits, stats.
// It deliberately has NO Minecraft or Fabric dependency so it stays unit-testable and
// reusable for offline training. NoGameImportsTest additionally scans the bytecode.
plugins {
	id 'java-library'
}

group = rootProject.group
version = rootProject.version

repositories {
	mavenCentral()
}

dependencies {
	// Gson for the JSON profile/kit formats (Minecraft 26.2 ships gson 2.14.0 at runtime; we compile against the same version).
	api 'com.google.code.gson:gson:2.14.0'

	testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

// Trains a model in the duel simulator: ./gradlew :sparbot-core:trainSword (or trainUhc) -Pgenerations=300 -Pout=model.json [-Pstart=old.json]
['sword', 'uhc'].each { mode ->
	tasks.register("train${mode.capitalize()}", JavaExec) {
		group = 'sparbot'
		description = "Trains a learned ${mode} melee model (imitation, then self-play) in the duel simulator."
		classpath = sourceSets.main.runtimeClasspath
		mainClass = 'io.github.flick256.sparbot.core.ml.Train'
		args = [
			mode,
			project.findProperty('generations') ?: '100',
			project.findProperty('out') ?: layout.buildDirectory.file("models/${mode}.json").get().asFile.path,
			project.findProperty('start') ?: ''
		]
		jvmArgs = ['-Xmx2g']
	}
}

// The scripted tiers against each other in the simulator: ./gradlew :sparbot-core:tournament -Pfights=400
tasks.register('tournament', JavaExec) {
	group = 'sparbot'
	description = 'Prints how often each skill level beats each other one in the duel simulator.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'io.github.flick256.sparbot.core.sim.Tournament'
	args = [project.findProperty('fights') ?: '100']
}
